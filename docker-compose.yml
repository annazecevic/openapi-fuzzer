services:

  mock-api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./mock_api.py:/app/mock_api.py
    command: sh -c "pip install fastapi uvicorn --quiet && uvicorn mock_api:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/books')"]
      interval: 5s
      timeout: 5s
      retries: 10

  fuzzer:
    build: .
    volumes:
      - ./reports:/app/reports
    command: sh -c "python3 -m fuzzer --spec examples/bookstore.yaml --url http://mock-api:8080 --output-dir /app/reports --pdf"
    depends_on:
      mock-api:
        condition: service_healthy