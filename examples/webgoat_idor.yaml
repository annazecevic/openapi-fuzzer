openapi: "3.0.3"

info:
  title: WebGoat IDOR API
  version: "1.0.0"
  description: OpenAPI spec za WebGoat IDOR endpointe za fuzz testiranje

paths:

  /WebGoat/IDOR/profile:
    get:
      operationId: getProfile
      summary: Dohvati profil trenutnog korisnika
      responses:
        "200":
          description: Profil korisnika
        "401":
          description: Neautorizovan pristup

  /WebGoat/IDOR/profile/{userId}:
    get:
      operationId: getProfileById
      summary: Dohvati profil po userId — IDOR ranjivost
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profil pronađen
        "401":
          description: Neautorizovan
        "403":
          description: Zabranjen pristup

    put:
      operationId: updateProfileById
      summary: Ažuriraj tuđi profil — IDOR + Type Confusion
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            # Tipovi userId i role potvrđeni uživo protiv WebGoat 2025.3 (docker
            # webgoat/webgoat), tri nezavisna izvora u browseru se slažu:
            # {role=3, userId=2342384, ...} — oba integer, ne string. PUT telo
            # pretpostavljeno istog formata (REST konvencija, isti path za GET/PUT
            # prema zvaničnom WebGoat lesson metadata JSON-u).
            schema:
              type: object
              required:
                - name
                - color
                - role
                - userId
              properties:
                name:
                  type: string
                color:
                  type: string
                role:
                  type: integer
                size:
                  type: string
                userId:
                  type: integer
      responses:
        "200":
          description: Profil ažuriran
          content:
            application/json:
              schema:
                type: object
                required: [lessonCompleted]
                properties:
                  lessonCompleted:
                    type: boolean
                  feedback:
                    type: string
        "401":
          description: Neautorizovan
        "403":
          description: Zabranjen pristup